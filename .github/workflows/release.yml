name: Release

# Bir "v*" etiketi push'landığında (ör. v1.0.0) tetiklenir. Etiketi OLUŞTURMAK/PUSH'LAMAK
# kullanıcının kararıdır — bu workflow yalnızca altyapıyı sağlar, kimse burada otomatik
# bir etiket oluşturmaz.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  package:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sürümü etiketten çıkar (v1.0.0 -> 1.0.0)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tek dosya, kendi kendine yeten yayın üret
        run: dotnet publish src/SerkonDiskSuite.App -c Release

      - name: Taşınabilir zip oluştur (installer'sız alternatif)
        shell: pwsh
        run: |
          $publishDir = "src/SerkonDiskSuite.App/bin/Release/net8.0-windows/win-x64/publish"
          $zipPath = "SerkonDiskSuite-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath

      - name: Inno Setup kur (windows-latest runner imajında her zaman bulunmuyor)
        run: choco install innosetup --no-progress -y

      - name: Installer derle
        shell: pwsh
        run: |
          $isccPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe bulunamadı — Inno Setup kurulumu başarısız olmuş olabilir."
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\setup.iss

      - name: Yapıtları yükle
        uses: actions/upload-artifact@v4
        with:
          name: SerkonDiskSuite-release-assets
          path: |
            SerkonDiskSuite-*-win-x64.zip
            installer/output/SerkonDiskSuite-Setup-*.exe

      - name: GitHub Release oluştur ve varlıkları ekle
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            SerkonDiskSuite-*-win-x64.zip
            installer/output/SerkonDiskSuite-Setup-*.exe
